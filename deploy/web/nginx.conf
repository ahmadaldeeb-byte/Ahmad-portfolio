# Heroes World — web release on nginx (HTTPS).
# Copy the contents of `out/` (after `npm run build`) to /var/www/heroes-world.
server {
    listen 80;
    server_name example-school.edu;            # ← your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example-school.edu;            # ← your domain
    ssl_certificate     /etc/letsencrypt/live/example-school.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-school.edu/privkey.pem;

    root /var/www/heroes-world;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    types { application/manifest+json webmanifest; }

    # Pages: /library → /library/index.html (the build uses trailing slashes).
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }
    # Hashed scripts, styles and fonts never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # The offline cache must always be checked for a new release.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    error_page 404 /404.html;
}
